# MQTT-Integration – nur aktiv mit Spring-Profil 'mqtt' (SPRING_PROFILES_ACTIVE=mqtt).
# Secrets ausschliesslich über Umgebungsvariablen (keine Passwörter im Repo).
mqtt:
  broker:
    url: ${MQTT_BROKER_URL:tcp://localhost:1883}       # z. B. tcp://nas.local:1883 oder tls://nas.local:8883
    username: ${MQTT_BROKER_USERNAME:}
    password: ${MQTT_BROKER_PASSWORD:}
  client-id: ${MQTT_CLIENT_ID:zev-backend-subscriber}
  topic: ${MQTT_TOPIC:zev/+/+/messwert}
  # Zweites Abo fuer die gPlugK im Nachbarhaus (Tasmota-SENSOR-Meldung, Specs/MQTT-Integration.md
  # FR-10). Leer = kein gPlug-Abo.
  topic-gplug: ${MQTT_TOPIC_GPLUG:gPlug/+/+/tele/SENSOR}
  qos: ${MQTT_QOS:1}
  # false = dauerhafte Sitzung: der Broker puffert die Nachrichten, solange das Backend fehlt
  # (z. B. beim Update). Client-ID darf je Broker nur von einer Instanz benutzt werden.
  clean-session: ${MQTT_CLEAN_SESSION:false}
