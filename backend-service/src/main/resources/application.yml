server:
  port: 8090
  # Hinter dem Reverse-Proxy (caddy) endet TLS am Proxy; intern spricht das Backend HTTP.
  # Ohne diese Einstellung rekonstruiert Spring die Anfrage deshalb als http://host:8443,
  # waehrend der Browser "Origin: https://host:8443" sendet - derselbe Aufruf gilt dann als
  # CORS-Anfrage und wird ohne passenden Eintrag in app.cors.allowed-origins mit
  # "Invalid CORS request" (403) abgewiesen. Betroffen sind nur NICHT-GET-Aufrufe, weil der
  # Browser bei gleicher Herkunft sonst gar keinen Origin-Header sendet (Specs/HTTPS.md).
  #
  # 'framework' registriert Springs ForwardedHeaderFilter: Schema, Host und Port werden aus
  # X-Forwarded-* uebernommen, der Aufruf wird korrekt als same-origin erkannt und CORS
  # entfaellt. Die Proxy-Origin muss damit beim Hostnamenwechsel nirgends nachgezogen werden.
  #
  # Vertrauensfrage: Der Filter glaubt den X-Forwarded-Headern ungeprueft, und Port 8090 ist
  # am Host veroeffentlicht. Der Schaden bleibt hier klein, weil die Anwendung keine absoluten
  # URLs aus dem Request baut (kein Host-Header-Poisoning moeglich) und die Authentisierung
  # ueber Bearer-Token statt Cookies laeuft. Ein gefaelschter Origin bringt zudem nichts:
  # Spring stuft die Anfrage dann als same-origin ein und setzt KEIN
  # Access-Control-Allow-Origin - der Browser blockiert die Antwort weiterhin.
  forward-headers-strategy: framework

# Application-specific configuration
app:
  cors:
    # Comma-separated list of allowed browser origins for the REST API (/api/**).
    # Override in production via env var APP_CORS_ALLOWED_ORIGINS (e.g. https://zev.example.ch).
    #
    # Die Proxy-Origin steht hier NICHT: Hinter caddy ist der Aufruf same-origin, Spring
    # erkennt das am uebereinstimmenden Host-Header und prueft CORS gar nicht erst.
    # Bei TLS-Terminierung am Proxy gilt das nicht mehr (Origin https://..., rekonstruierte
    # Anfrage http://...) - dann muss die https-Origin ueber APP_CORS_ALLOWED_ORIGINS dazu.
    allowed-origins: "http://localhost:4200,http://prometheus:9090,http://localhost:8081"

spring:
  jackson:
    use-jackson2-defaults: true
  application:
    name: backend-service
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 100
          temperature: 0.0
          # Prompt Caching with AnthropicCacheStrategy.SYSTEM_AND_TOOLS requires Spring AI 1.1.0+
          # Token usage is logged in EinheitMatchingService
  boot:
    admin:
      client:
        url: ${ADMIN_URL:http://admin-service:8081}
        # Basic-Auth-Zugangsdaten fuer die Registrierung am SBA-Server (POST /instances).
        username: ${SBA_USER:sba}
        password: ${SBA_PASSWORD:sba}
        instance:
          prefer-ip: true
          service-url: http://backend-service:8090
          metadata:
            # Basic-Auth-Zugangsdaten, mit denen der SBA-Server die geschuetzten
            # Actuator-Endpoints dieses Service abruft (Details: Environment, Logger, ...).
            user.name: ${ACTUATOR_USER:actuator}
            user.password: ${ACTUATOR_PASSWORD:actuator}
  datasource:
    url: jdbc:postgresql://localhost:5432/zev
    username: postgres
    password: postgres
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: zev
    show-sql: false
  
  flyway:
    schemas: zev
    create-schemas: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BACKEND_JWT_ISSUER_URI:http://localhost:9000/realms/zev}
          # Optionale Audience-Validierung des aud-Claims (Spring-Boot-nativ, A07).
          # Leer/auskommentiert = aus (nur Issuer-/Timestamp-Pruefung). Zum Aktivieren
          # den erwarteten Wert (z.B. Keycloak-Client/Resource) eintragen:
          # audiences:
          #  - zev-frontend

# Basic-Auth-Zugangsdaten fuer /actuator/** (SecurityConfig.actuatorFilterChain).
# Defaults nur fuer lokale Entwicklung – in Produktion via Env ueberschreiben.
actuator:
  user: ${ACTUATOR_USER:actuator}
  password: ${ACTUATOR_PASSWORD:actuator}

management:
  endpoints:
    web:
      # Security: alle Endpoints exponiert, aber /actuator/** ist per Basic Auth
      # geschuetzt (SecurityConfig.actuatorFilterChain). Nur health/info/prometheus
      # bleiben oeffentlich (Docker-Healthchecks, Prometheus-Scrape).
      exposure:
        include: "*"
      cors:
        allowed-origins: "http://localhost:8081,http://admin-service:8081"
        allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  endpoint:
    health:
      show-details: when_authorized
    env:
      show-values: when_authorized
    configprops:
      show-values: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

# Systemmeldungen: Aufbewahrung (Retention) erledigter Einträge
systemmeldung:
  retention:
    tage: 90                 # erledigte Meldungen älter als N Tage werden gelöscht
    cron: "0 0 3 * * *"      # täglich 03:00 (Cleanup-Job, ohne mqtt-Profil)

# Preiszeitreihe: dynamische Einspeisepreise (Specs/Preiszeitreihe.md)
preiszeitreihe:
  url: "https://api.bkw.ch/api/dyntariffs/v1/Tariffs"   # Quelle der Einspeisepreise (oeffentlich)
  download:
    cron: "0 0 2 * * *"    # täglich 02:00; nur wenn mindestens ein Mandant das Flag aktiv hat
  timeout:
    # Ohne Grenzen haengt der Job im Zweifel bis zum naechsten Lauf an einer stummen Verbindung.
    verbindung: 5s
    lesen: 10s

# Logging Configuration
logging:
  level:
    root: INFO
    ch.nacht: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
  
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  
  file:
    name: logs/zev-application.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

# Note: Invoice configuration (zahlungsfrist, IBAN, steller) is now managed
# in the database via /api/einstellungen. Tariffs are managed via /api/tarife.
