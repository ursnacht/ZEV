<div class="form-container">
  <h2>{{ formData.id ? ('TARIFPOSITION_BEARBEITEN' | translate) : ('NEUE_TARIFPOSITION_ERSTELLEN' | translate) }}</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="zev-form-group">
      <label for="tarifId">{{ 'TARIF' | translate }}:</label>
      <select id="tarifId" class="zev-select" [(ngModel)]="formData.tarifId" name="tarifId" required>
        <option [ngValue]="0">{{ 'TARIF_WAEHLEN' | translate }}</option>
        @for (tarif of tarife; track tarif.id) {
          <option [ngValue]="tarif.id">{{ tarif.bezeichnung }}</option>
        }
      </select>
      @if (tarife.length === 0) {
        <div class="zev-form-hint">{{ 'KEIN_LADESTROM_TARIF_HINT' | translate }}</div>
      }
    </div>

    <div class="zev-form-row">
      <div class="zev-form-group">
        <label for="jahr">{{ 'JAHR' | translate }}:</label>
        <select id="jahr" class="zev-select" [(ngModel)]="formData.jahr" name="jahr" required>
          @for (j of jahrOptionen; track j) {
            <option [ngValue]="j">{{ j }}</option>
          }
        </select>
      </div>

      <div class="zev-form-group">
        <label for="quartal">{{ 'QUARTAL' | translate }}:</label>
        <select id="quartal" class="zev-select" [(ngModel)]="formData.quartal" name="quartal" required>
          @for (q of quartalOptionen; track q) {
            <option [ngValue]="q">Q{{ q }}</option>
          }
        </select>
      </div>
    </div>

    <div class="zev-form-group">
      <label for="menge">{{ 'MENGE' | translate }} (kWh):</label>
      <input type="number" id="menge" class="zev-input" [(ngModel)]="formData.menge" name="menge"
        min="0" step="0.001" required />
      <div class="zev-form-hint">{{ 'TARIFPOSITION_MENGE_HINT' | translate }}</div>
    </div>

    <div class="zev-form-group">
      <label for="quellReferenz">{{ 'QUELL_REFERENZ' | translate }}:</label>
      <input type="text" id="quellReferenz" class="zev-input" [(ngModel)]="formData.quellReferenz"
        name="quellReferenz" maxlength="64" />
      <div class="zev-form-hint">{{ 'QUELL_REFERENZ_HINT' | translate }}</div>
    </div>

    <div class="zev-form-group">
      <label for="bemerkung">{{ 'BEMERKUNG' | translate }}:</label>
      <input type="text" id="bemerkung" class="zev-input" [(ngModel)]="formData.bemerkung"
        name="bemerkung" maxlength="200" />
    </div>

    <div class="zev-form-actions zev-form-actions--equal">
      <button type="submit" class="zev-button zev-button--primary" [disabled]="!isFormValid()">
        <app-icon name="check"></app-icon>
        {{ formData.id ? ('AKTUALISIEREN' | translate) : ('ERSTELLEN' | translate) }}
      </button>
      <button type="button" class="zev-button zev-button--secondary" (click)="onCancel()">
        <app-icon name="x"></app-icon>
        {{ 'ABBRECHEN' | translate }}
      </button>
    </div>
  </form>
</div>
