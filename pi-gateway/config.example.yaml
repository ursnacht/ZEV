# ZEV Pi-Gateway – Beispiel-Konfiguration
#
# Kopieren nach config.yaml und anpassen. Secrets NICHT hier eintragen, sondern
# über ${ENV_VAR} referenzieren (siehe .env.example / systemd EnvironmentFile).
#
# Die Zähler-Liste ('zaehler') hat beliebige Länge (typisch 10–20 oder mehr).
# Ein zusätzlicher Zähler = nur ein weiterer Listeneintrag, kein Code-Change.

org_id: 42                       # internes org_id (BIGINT) des Mandanten
publish_interval: 5m             # z. B. "30s", "5m", "1h" oder reine Sekunden-Zahl

# Lese-Timeout je Zähler (Default 5s). Hochsetzen, wenn Reads mit "keine Antwort"
# fehlschlagen – an einem RTU->TCP-Hub reicht die Anfrage seriell bis zum Slave durch.
# Je Zähler via zaehler[].read_timeout überschreibbar. Zahl (Sekunden) oder "8s"/"1m".
read_timeout: 5s

# Lese-Versuche je Zähler und Zyklus, inklusive Erstversuch (Default 2 = ein Retry).
# 1 = kein Retry. Fängt sporadische RTU-Fehler ab (z. B. exception_code=11 vom
# WAGO-Kommunikationsmodul 879-9000, das keinen einstellbaren Response-Timeout hat).
# Unschädlich, weil absolute Zählerstände publiziert werden. Gilt global (nicht je Zähler).
read_attempts: 2

broker:
  url: tcp://nas.local:1883      # bzw. tls://nas.local:8883
  username: ${MQTT_USERNAME}     # aus der Umgebung (EnvironmentFile)
  password: ${MQTT_PASSWORD}
  qos: 1                         # 0 oder 1 genügt (absolute Stände sind verlusttolerant)
  client_id: zev-pi-gateway-org42

# Register-Adressen als String = HEXADEZIMAL (wie Wago-Datenblatt), daher gequotet.
# Werte 'addr'/'typ'/'skalierung' sind BEISPIELHAFT – gemäss Datenblatt/mbpoll setzen.
# Die 3 Wago hängen an EINEM Modbus-TCP-Hub (RTU→TCP): gleiche host/port (Hub-IP),
# verschiedene unit_id (Slave-Adresse). Siehe docs/Netzwerk-Topologie-Hene.md.
# seriennummer (optional): Seriennummer des verbauten Geräts, einmalig am Zähler abgelesen
# (z. B. per mbpoll, siehe README). Sie ist das Signal für die Zählertausch-Erkennung im Backend:
# BEIM ZÄHLERTAUSCH HIER DIE NEUE NUMMER EINTRAGEN, sonst bleibt der Tausch unerkannt.
# Damit das beim ersten Tausch greift, müssen alle Zähler vorab eine Seriennummer haben
# (siehe docs/Zaehlertausch.md). Fehlt sie, verhält sich das Backend wie bisher.
zaehler:
  - messpunkt: "ID742-Wohnung-1"
    seriennummer: "WAGO-8791234"
    protokoll: modbus-tcp
    host: 192.168.10.10          # IP des Modbus-TCP-Hubs (für alle Wago gleich)
    port: 502
    unit_id: 1                   # Slave-Adresse dieses Zählers am Hub
    # read_timeout: 8s           # optional: überschreibt den globalen Wert NUR für diesen Zähler
    # 'einspeisung' ist OPTIONAL: fehlt der Block (typisch bei Konsumenten, die nicht
    # einspeisen), wird das Register nicht gelesen und 0 publiziert – ein Modbus-Zugriff
    # weniger je Zyklus. Ein VORHANDENER, aber fehlerhafter Block ist weiter ein Startfehler.
    register:                    # Wirkenergie in kWh
      bezug:       { addr: "600C", typ: float32, wortfolge: big, skalierung: 1.0 }  # OBIS 1.8.0
      einspeisung: { addr: "6018", typ: float32, wortfolge: big, skalierung: 1.0 }  # OBIS 2.8.0

  # Konsument ohne Einspeisung: nur 'bezug' konfiguriert -> einspeisung wird als 0 publiziert.
  - messpunkt: "ID742-Wohnung-2"
    seriennummer: "WAGO-8791235"
    protokoll: modbus-tcp
    host: 192.168.10.10
    port: 502
    unit_id: 2
    register:
      bezug:       { addr: "600C", typ: float32, wortfolge: big, skalierung: 1.0 }

  - messpunkt: "ID742-Allgemein"
    seriennummer: "WAGO-8791236"
    protokoll: modbus-tcp
    host: 192.168.10.10
    port: 502
    unit_id: 3
    register:
      bezug:       { addr: "600C", typ: float32, wortfolge: big, skalierung: 1.0 }

# Später (Erweiterung): BKW als weiterer Eintrag mit  protokoll: gplug  (siehe Spec, Offene Fragen).
