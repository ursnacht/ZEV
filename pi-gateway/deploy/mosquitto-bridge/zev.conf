# Mosquitto auf dem Pi: nimmt die Meldungen der gPlugK im LAN an und leitet sie per Bridge
# an den Broker auf dem NAS weiter (docs/Netzwerk-Topologie-Hene.md, Specs/MQTT-Integration.md,
# FR-10). Das Pi-Gateway benutzt diesen Broker nicht, es publiziert direkt an den NAS.
#
# Ziel: /etc/mosquitto/conf.d/zev.conf
#
# persistence, persistence_location und log_dest setzt schon /etc/mosquitto/mosquitto.conf
# (Debian) - doppelt eingetragen bricht Mosquitto beim Start ab.
# Kommentare nur auf eigenen Zeilen: Mosquitto liest "# ..." am Zeilenende als Wert.

# Die gPlugs verbinden sich auf die LAN-IP des Pi
listener 1883
# Seltener auf Disk schreiben (SD-Karten schonen)
autosave_interval 300

allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Die gPlugs publizieren mit QoS 0: ohne diese Zeile puffert der Broker fuer die Bridge
# nichts, solange VPN oder NAS weg sind. ~300 Meldungen pro Stunde (5 gPlugs), 20000 = ~2.5 Tage.
queue_qos0_messages true
max_queued_messages 20000
