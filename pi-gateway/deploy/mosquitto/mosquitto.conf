# Mosquitto-Konfiguration NUR für lokale Entwicklung/Simulation.
# Auth aktiviert (Username/Passwort aus passwd). NICHT für Produktion verwenden
# (dort zusätzlich getrennte User pro Publisher/Subscriber, ACL + TLS,
# siehe docs/Netzwerk-Topologie-Hene.md).
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd

# Keine "New connection"/"disconnected"-Logeinträge (z.B. vom 60s-Healthcheck).
connection_messages false

# Persistenz: Sitzungen und gepufferte Nachrichten der dauerhaften Backend-Sitzung
# (mqtt.clean-session=false) ueberstehen einen Neustart des Brokers. Das Verzeichnis
# ist ein Volume (docker-compose-mqtt.yml: mosquitto-data).
persistence true
persistence_location /mosquitto/data/
# Warteschlange je Client: ~1050 Nachrichten pro Stunde (18 Zaehler, etwa jede Minute);
# der Standard 1000 reicht nur fuer rund eine Stunde, 100000 fuer ~4 Tage.
max_queued_messages 100000
# Sitzung einer nicht mehr benutzten Client-ID nach 14 Tagen verwerfen
persistent_client_expiration 14d
