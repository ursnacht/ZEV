# Mosquitto-Konfiguration NUR für lokale Entwicklung/Simulation.
# Auth aktiviert (Username/Passwort aus passwd). NICHT für Produktion verwenden
# (dort zusätzlich getrennte User pro Publisher/Subscriber, ACL + TLS,
# siehe docs/Netzwerk-Topologie-Hene.md).
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd

# Keine "New connection"/"disconnected"-Logeinträge (z.B. vom 60s-Healthcheck).
connection_messages false

# Persistenz: Sitzungen und gepufferte Nachrichten der dauerhaften Backend-Sitzung
# (mqtt.clean-session=false) ueberstehen einen Neustart des Brokers. Das Verzeichnis
# ist ein Volume (docker-compose-mqtt.yml: mosquitto-data).
persistence true
persistence_location /mosquitto/data/
# Alle 5 Minuten speichern statt alle 30 (Standard): Bei einem Absturz des Brokers
# fehlt hoechstens, was in den letzten 5 Minuten dazukam. Beim sauberen Beenden
# wird ohnehin gespeichert.
autosave_interval 300
# Warteschlange je Client: ~1300 Nachrichten pro Stunde (17 Zaehler ueber das Pi-Gateway
# + ca. 5 gPlugs, etwa jede Minute); der Standard 1000 reicht nicht einmal fuer eine Stunde,
# 100000 fuer ~3 Tage.
max_queued_messages 100000
# Die gPlugs publizieren mit QoS 0 (ueber die Bridge des Pi). Ohne diese Zeile verwirft der
# Broker ihre Meldungen, solange das Backend weg ist (Specs/MQTT-Integration.md, NFR-3).
queue_qos0_messages true
# Sitzung einer nicht mehr benutzten Client-ID nach 14 Tagen verwerfen
persistent_client_expiration 14d
